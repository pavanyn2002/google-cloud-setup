# The three environments. Every app is deployed once into each namespace:
#   dev   developers' latest build
#   test  release candidate, for QA
#   prod  what customers use (moves to its own cluster at go-live)
#
# Each namespace gets two guard rails:
#   ResourceQuota  a ceiling for the whole environment, so a runaway dev
#                  deployment cannot take the memory prod needs
#   LimitRange     defaults for containers that don't declare their own
#                  requests/limits (the quota rejects pods without them)
#
# Sized for 2 workers of 4 GB each. Raise the numbers when you add workers.
#
#   kubectl apply -f platform/namespaces/environments.yaml
#   kubectl describe quota -n dev
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    env: dev
    # Warn (don't block) when a pod asks for risky settings such as privileged mode.
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: dev
spec:
  hard:
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.memory: 3Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 256Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    env: test
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: test
spec:
  hard:
    requests.cpu: 750m
    requests.memory: 1536Mi
    limits.memory: 3Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: test
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 256Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    env: prod
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: prod
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 256Mi
