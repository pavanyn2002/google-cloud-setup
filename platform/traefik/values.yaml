# Traefik ingress controller for a self-managed cluster on GCP.
#
# A DaemonSet runs one Traefik pod per worker, bound to the node's ports 80/443
# (hostPort). The Terraform load balancer sends public traffic to those ports.
# No Service of type LoadBalancer is used: a self-built cluster has no cloud
# controller to create one.
#
# Install:
#   helm repo add traefik https://traefik.github.io/charts
#   helm repo update
#   helm upgrade --install traefik traefik/traefik -n traefik --create-namespace \
#     -f platform/traefik/values.yaml
deployment:
  kind: DaemonSet

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

service:
  type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
  # Gateway API (the successor to Ingress) is switched on in a later stage,
  # after its CRDs are installed.
  kubernetesGateway:
    enabled: false
